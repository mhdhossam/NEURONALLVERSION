name: NEURON Graph Transformer Operations

on:
  push:
    branches: ["experiment/neuron-transformer-ops"]
  pull_request:
    branches: [main]
    paths:
      - "transformer_research/**"
      - "tests/test_graph_transformer.py"
      - ".github/workflows/neuron-transformer-ops.yml"

jobs:
  graph-transformer-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile prototype
        run: python -m py_compile transformer_research/graph_transformer.py benchmarks/benchmark_graph_transformer_ops.py
      - name: Run graph Transformer operation tests
        run: python -m unittest tests.test_graph_transformer -v
      - name: Run existing NEURON core tests
        run: python -m unittest discover -s tests -p "test_engine.py" -v
      - name: Benchmark sparse projection operation
        run: python benchmarks/benchmark_graph_transformer_ops.py --hidden 256 --fan-in 16 --repeats 100
