name: Neuron V3 image embedding comparison

on:
  push:
    branches:
      - experiment/neuron-v3-image-baseline-2026-10-17
    paths:
      - "experiments/neuron_v3_image_embedding_comparison.py"
      - ".github/workflows/neuron-v3-image-embedding.yml"

permissions:
  contents: read

jobs:
  embedding-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compare raw pixel tokens vs learned CNN embeddings through real Neuron V3
        run: |
          python experiments/neuron_v3_image_embedding_comparison.py \
            --epochs 20 \
            --json-output artifacts/neuron-v3-image-embedding-results.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: neuron-v3-image-embedding-results
          path: artifacts/neuron-v3-image-embedding-results.json
          if-no-files-found: error
