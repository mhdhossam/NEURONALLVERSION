name: Neuron v3 tests and benchmark

on:
  push:
    paths:
      - "neuron_core/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/neuron-v3.yml"
  pull_request:
    paths:
      - "neuron_core/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/neuron-v3.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repeatable relational retrieval benchmark
        run: python benchmarks/benchmark_retrieval.py --sizes 100,1000,5000 --top-k 5 --json-output benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-v3-benchmark-results
          path: benchmark-results.json
          if-no-files-found: error

  neural-matrix-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pretrained embedding baseline
        run: python -m pip install "sentence-transformers==6.1.0"
      - name: Benchmark metadata guard on held-out image classes
        run: python benchmarks/benchmark_metadata_guard_classification.py --json-output benchmarks/results/metadata-guard-classification-results.json
      - name: Compare Neuron with dense neural embedding retrieval
        run: python benchmarks/benchmark_neural_matrix_vs_graph.py --sizes 100,1000,5000 --json-output neuron-vs-matrix-results.json
      - name: Stress-test ambiguous, multi-hop, unseen paraphrase, and contradictory facts
        run: python benchmarks/benchmark_adversarial_reasoning.py --sizes 100,1000,5000 --json-output adversarial-reasoning-results.json
      - name: Diagnose relation interpretation, candidate recall, ranking, and source-only leakage
        run: python benchmarks/benchmark_stage_diagnostic.py --sizes 100,1000,5000 --s2-facts 800 --top-k 5 --json-output stage-diagnostic-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-vs-neural-matrix-results
          path: neuron-vs-matrix-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-adversarial-reasoning-results
          path: adversarial-reasoning-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-stage-diagnostic-results
          path: stage-diagnostic-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-metadata-guard-classification-results
          path: benchmarks/results/metadata-guard-classification-results.json
          if-no-files-found: error
  facenet-neuron-open-set:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FaceNet and dataset dependencies
        run: python -m pip install "facenet-pytorch==2.6.0" scikit-learn
      - name: Run real LFW FaceNet + metadata-guard vs CNN benchmark
        run: >-
          python benchmarks/benchmark_neuron_facenet_lfw.py
          --seeds 2026,2027,2028
          --max-known-per-person 70
          --max-unknown-per-person 30
          --cnn-epochs 6
          --json-output benchmarks/results/neuron-facenet-lfw-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-facenet-lfw-results
          path: benchmarks/results/neuron-facenet-lfw-results.json
          if-no-files-found: error

  error-driven-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FaceNet and dataset dependencies
        run: python -m pip install "facenet-pytorch==2.6.0" scikit-learn
      - name: Test learning from errors with untouched audit set
        run: >-
          python benchmarks/benchmark_neuron_error_learning.py
          --seeds 2026,2027,2028
          --max-known-per-person 70
          --max-unknown-per-person 30
          --json-output benchmarks/results/neuron-error-learning-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-error-learning-results
          path: benchmarks/results/neuron-error-learning-results.json
          if-no-files-found: error

  context-processing-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests for observable processing traces
        run: python -m unittest discover -s tests -v
      - name: Compare query context variations without a decision layer
        run: python benchmarks/benchmark_context_variation.py --json-output context-processing-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-context-processing-results
          path: context-processing-results.json
          if-no-files-found: error
