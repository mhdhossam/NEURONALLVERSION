name: Neuron v3 tests and benchmark

on:
  push:
    paths:
      - "neuron_core/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/neuron-v3.yml"
  pull_request:
    paths:
      - "neuron_core/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/neuron-v3.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repeatable relational retrieval benchmark
        run: python benchmarks/benchmark_retrieval.py --sizes 100,1000,5000 --top-k 5 --json-output benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-v3-benchmark-results
          path: benchmark-results.json
          if-no-files-found: error

  neural-matrix-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pretrained embedding baseline
        run: python -m pip install "sentence-transformers==6.1.0"
      - name: Compare Neuron with dense neural embedding retrieval
        run: python benchmarks/benchmark_neural_matrix_vs_graph.py --sizes 100,1000,5000 --json-output neuron-vs-matrix-results.json
      - name: Stress-test ambiguous, multi-hop, unseen paraphrase, and contradictory facts
        run: python benchmarks/benchmark_adversarial_reasoning.py --sizes 100,1000,5000 --json-output adversarial-reasoning-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-vs-neural-matrix-results
          path: neuron-vs-matrix-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-adversarial-reasoning-results
          path: adversarial-reasoning-results.json
          if-no-files-found: error

  context-processing-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests for observable processing traces
        run: python -m unittest discover -s tests -v
      - name: Compare query context variations without a decision layer
        run: python benchmarks/benchmark_context_variation.py --json-output context-processing-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-context-processing-results
          path: context-processing-results.json
          if-no-files-found: error

  reasoning-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated reasoning unit tests
        run: python -m unittest discover -s tests -p "test_reasoning.py" -v
      - name: Measure bounded path exploration as unrelated nodes scale
        run: python benchmarks/benchmark_reasoning_experiment.py > neuron-reasoning-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-reasoning-experiment-results
          path: neuron-reasoning-results.json
          if-no-files-found: error

  meaning-understanding-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Benchmark meaning preservation before architecture changes
        run: python benchmarks/benchmark_meaning_understanding.py --top-k 5 --json-output neuron-meaning-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-v4-meaning-understanding-results
          path: neuron-meaning-results.json
          if-no-files-found: error

  genetic-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run first-attempt genetic-learning benchmark
        run: python benchmarks/benchmark_genetic_learning.py --top-k 5 --json-output neuron-genetic-learning.json
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-v4-genetic-learning-results
          path: neuron-genetic-learning.json
          if-no-files-found: error
