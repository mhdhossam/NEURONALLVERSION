name: Neuron v3 tests

on:
  push:
    paths:
      - "neuron_core/**"
      - "tests/**"
      - ".github/workflows/neuron-v3.yml"
  pull_request:
    paths:
      - "neuron_core/**"
      - "tests/**"
      - ".github/workflows/neuron-v3.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
